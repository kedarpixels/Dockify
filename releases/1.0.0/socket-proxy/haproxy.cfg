# Dockify socket proxy: the exact Docker Engine endpoints Dockify
# uses, listed by method and path. Only this server's agent reaches it. Anything else is refused with 403 before it reaches the socket:
# no build, commit, push, archive, exec or attach outside the managed names, prune, update, swarm,
# plugins, system (bar the one disk usage read below), auth, info, events other than the one
# start-event query below, or a network list other than the one environment-network query below.
#
# This gate looks at the method, path, query and headers, never at a request body. So it puts no
# limit on what a POST /containers/create asks for: host bind mounts, control-plane volumes,
# privileged mode, another container's namespaces. That check is the agent's gate
# (apps/agent/src/docker-gate.ts), by exact keys, in front of this file. The name gates below
# close the direct ways into the existing control containers and volumes, whatever a future gate
# bug lets through.
# The updater holds the raw socket by design and never goes through here.
#
# apps/worker/src/socket-proxy.test.ts parses every "http-request allow" line below and checks
# that each call Dockify makes matches one, and that a list of dangerous calls matches none, and
# apps/agent/src/docker-gate.test.ts holds the gate to the same two lists.
# Keep one rule per line, in the form:  http-request allow if METH_<X> { path_reg <regex> }
# optionally followed by more conditions of the two forms that test models:
#   { query -m reg <regex> }  and  { req.hdr_cnt(<header>) eq <n> }

global
    log stdout format raw daemon notice
    maxconn 256

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 10s
    # logs --follow, wait and attach stay open for as long as a job runs; the worker closes them.
    timeout client 24h
    timeout server 24h
    timeout tunnel 24h
    # The agent streams the image tar to POST /images/load as the build produces it, so the request
    # body only starts flowing minutes in. A short http-request timeout would abort that mid-build and
    # truncate the upload ("unrecognized image format"). Only the agent reaches this proxy (docker-api
    # network, internal), so a long header timeout poses no slowloris risk.
    timeout http-request 1h

frontend docker
    bind *:2375
    # The worker pins /v1.43; the prefix is optional so a future bump needs only a worker change.

    # read
    http-request allow if METH_GET { path_reg ^(/v1\.[0-9]+)?/containers/json$ }
    http-request allow if METH_GET { path_reg ^(/v1\.[0-9]+)?/containers/[^/]+/json$ }
    http-request allow if METH_GET { path_reg ^(/v1\.[0-9]+)?/containers/[^/]+/logs$ }
    http-request allow if METH_GET { path_reg ^(/v1\.[0-9]+)?/containers/[^/]+/stats$ }
    http-request allow if METH_GET { path_reg ^(/v1\.[0-9]+)?/images/json$ }
    http-request allow if METH_GET { path_reg ^(/v1\.[0-9]+)?/images/[^/]+/json$ }
    http-request allow if METH_GET { path_reg ^(/v1\.[0-9]+)?/networks/[^/]+$ }
    # The environment networks by name, for the sweep that removes orphaned ones (apps/worker/src/deploy/networks.ts).
    http-request allow if METH_GET { path_reg ^(/v1\.[0-9]+)?/networks$ } { query -m reg ^filters=%7B%22name%22%3A%5B%22dockify-(env|pv)-%22%5D%7D$ }
    http-request allow if METH_GET { path_reg ^(/v1\.[0-9]+)?/exec/[^/]+/json$ }
    # Disk usage for the Server page's breakdown (apps/worker/src/deploy/disk.ts), for images and
    # volumes only, so the query must name one or both of those types. A bare /system/df would also
    # size every container's writable layer, the slowest part, and Docker's build cache, which is
    # unused here. The answer names every local volume and its host path, which the worker could not
    # list before; deleting a volume stays limited to the managed names further down.
    http-request allow if METH_GET { path_reg ^(/v1\.[0-9]+)?/system/df$ } { query -m reg ^type=(image|volume)(&type=(image|volume))?$ }
    # Container start events of Dockify's own containers, and only those, so a restarted app gets
    # its route checked at once (apps/worker/src/edge/starts.ts). The filter is the whole query,
    # fixed: no other container's events, and no exec events with their commands, reach the worker.
    http-request allow if METH_GET { path_reg ^(/v1\.[0-9]+)?/events$ } { query -m reg ^filters=%7B%22type%22%3A%5B%22container%22%5D%2C%22event%22%3A%5B%22start%22%5D%2C%22label%22%3A%5B%22dockify\.managed%3Dtrue%22%5D%7D$ }

    # containers: every create body is built by containerSpec() in the worker and checked by exact
    # keys in the agent, where this proxy cannot see it (see the top of this file)
    http-request allow if METH_POST { path_reg ^(/v1\.[0-9]+)?/containers/create$ }
    http-request allow if METH_POST { path_reg ^(/v1\.[0-9]+)?/containers/[^/]+/start$ }
    http-request allow if METH_POST { path_reg ^(/v1\.[0-9]+)?/containers/[^/]+/stop$ }
    http-request allow if METH_POST { path_reg ^(/v1\.[0-9]+)?/containers/[^/]+/kill$ }
    # Rename only from one dk- name to another dk- name: the swap parks dk-<appId> as
    # dk-<appId>-prev-<t> and gives the name back on a rollback (deploy/swap.ts), always addressing
    # the container by name. This keeps the api and postgres control containers from being renamed
    # into the names that exec and attach trust below. The new name has to be the whole query
    # string, because an ACL on url_param(name) passes when any one of several name= copies
    # matches, while Docker reads only the first. And there must be no Content-Type, because
    # Docker also reads a form body, whose fields win over the query string.
    http-request allow if METH_POST { path_reg ^(/v1\.[0-9]+)?/containers/dk-[A-Za-z0-9_.-]+/rename$ } { query -m reg ^name=dk-[A-Za-z0-9_.-]+$ } { req.hdr_cnt(content-type) eq 0 }
    http-request allow if METH_POST { path_reg ^(/v1\.[0-9]+)?/containers/[^/]+/wait$ }
    http-request allow if METH_DELETE { path_reg ^(/v1\.[0-9]+)?/containers/[^/]+$ }

    # exec and attach: the data module's dump and restore, on its own service and helper containers,
    # which it addresses by their managed names (dk-<appId>, dockify-rt/bk/rs-<id>; data/pipeline.ts),
    # and the web terminal, on dk-<appId> only, which also compares the exec's container id with the
    # container it checked before starting it (terminal/session.ts). This refuses exec into an existing container by daemon id or by any other
    # name, so the api and postgres control containers (and the master key in the api) cannot be
    # reached directly. Rename (above) cannot move them into these names, and the name allows no
    # "%", so an encoded slash cannot reach a legacy link alias (dk-x/alias) that points at another
    # container. The gate in front of this file refuses a create that mounts a control-plane volume
    # or joins another container's namespaces, so nothing under these names can be one. The exec id
    # from a create is already scoped, so starting and polling it stay open.
    http-request allow if METH_POST { path_reg ^(/v1\.[0-9]+)?/containers/(dk-|dockify-(rt|bk|rs)-)[A-Za-z0-9_.-]+/attach$ }
    http-request allow if METH_POST { path_reg ^(/v1\.[0-9]+)?/containers/(dk-|dockify-(rt|bk|rs)-)[A-Za-z0-9_.-]+/exec$ }
    http-request allow if METH_POST { path_reg ^(/v1\.[0-9]+)?/exec/[^/]+/start$ }
    # The web terminal's window size. An exec id is 64 hex characters and scoped to its exec already, and
    # this call changes nothing but a pty's rows and columns, so the whole query is fixed to those two numbers.
    http-request allow if METH_POST { path_reg ^(/v1\.[0-9]+)?/exec/[0-9a-f]{64}/resize$ } { query -m reg ^h=[0-9]{1,3}&w=[0-9]{1,3}$ }

    # images: pull and load; never build, commit, push, prune or history. A pull's query is the whole
    # of it, and it has no Content-Type, because a form body's fields would win over the query and
    # reopen fromSrc, an import from any URL. A load is the agent's own client, after a build; the gate
    # in front of this file does not offer it. A delete takes the id Docker gave, or a build's own tag.
    # The deny comes first: dockerd pulls from the host's network, so a registry may not be this host, its
    # metadata service, or a control network, in any spelling of the address. A LAN registry stays allowed.
    # A DNS name that resolves to one of these is not covered here. apps/agent/src/registry-host.ts is the
    # full check and says why; apps/worker/src/socket-proxy.test.ts holds this line to it. A name with no
    # dot and no port is not a host at all to Docker (metadata/x is on Docker Hub), so it needs the port here.
    http-request deny deny_status 403 if METH_POST { path_reg ^(/v1\.[0-9]+)?/images/create$ } { query -m reg -i ^fromImage=((([a-z0-9_-]+\.)*localhost|localhost\.localdomain|([a-z0-9_-]+\.)*docker\.internal|metadata\.goog|metadata\.google\.internal|instance-data\.[a-z0-9_.-]+|(0|127)\.[0-9]+\.[0-9]+\.[0-9]+|169\.254\.[0-9]+\.[0-9]+|100\.100\.100\.200|168\.63\.129\.16|172\.30\.[1-5]\.[0-9]+|([0-9]+|0x[0-9a-f]*)(\.([0-9]+|0x[0-9a-f]*)){1,2}|(([0-9]+|0x[0-9a-f]*)\.)+(0x[0-9a-f]*|0[0-9]+)(\.([0-9]+|0x[0-9a-f]*))*|(0x[0-9a-f]*|0[0-9]+)(\.([0-9]+|0x[0-9a-f]*))+)\.*(%3A[^%]*)?|(ip6-localhost|ip6-loopback|metadata|instance-data|([0-9]+|0x[0-9a-f]*))(\.+(%3A[^%]*)?|%3A[^%]*))%2F }
    http-request allow if METH_POST { path_reg ^(/v1\.[0-9]+)?/images/create$ } { query -m reg ^fromImage=[A-Za-z0-9._-]*(%(2F|3A|40)[A-Za-z0-9._-]*)*(&tag=[A-Za-z0-9._-]+)?$ } { req.hdr_cnt(content-type) eq 0 }
    http-request allow if METH_POST { path_reg ^(/v1\.[0-9]+)?/images/load$ }
    http-request allow if METH_DELETE { path_reg ^(/v1\.[0-9]+)?/images/(sha256%3A[a-f0-9]{64}|dockify%2Fapp-[A-Za-z0-9._-]+%3A[A-Za-z0-9._-]+)$ }

    # networks and volumes
    http-request allow if METH_POST { path_reg ^(/v1\.[0-9]+)?/networks/create$ }
    http-request allow if METH_POST { path_reg ^(/v1\.[0-9]+)?/networks/[^/]+/connect$ }
    http-request allow if METH_POST { path_reg ^(/v1\.[0-9]+)?/networks/[^/]+/disconnect$ }
    # Delete only an environment's or a preview's own network, by its full name, so no control network can go.
    http-request allow if METH_DELETE { path_reg ^(/v1\.[0-9]+)?/networks/dockify-(env|pv)-[0-9a-f-]{36}$ }
    http-request allow if METH_POST { path_reg ^(/v1\.[0-9]+)?/volumes/create$ }
    # Delete only the worker's own volume names (dockify-data-<appId> services, dk-<appId>-<name>
    # compose app volumes). Volumes are addressed only by name, so an id cannot sidestep this, and
    # the control-plane volumes (dockify-db, dockify_dockify-db) cannot be deleted through the
    # proxy. That does not put the control database out of a compromised worker's reach: a
    # container it creates can mount those volumes, and it connects to Postgres as the bootstrap
    # superuser (deploy/entrypoint.sh), so it can read or drop the database over SQL.
    http-request allow if METH_DELETE { path_reg ^(/v1\.[0-9]+)?/volumes/(dockify-data-|dk-)[^/]+$ }
    # Delete an anonymous volume, named by 64 hex characters: the sweep removes empty ones and older
    # restore test copies (apps/worker/src/data/leftovers.ts). Docker refuses one a container uses,
    # and no control-plane volume has such a name.
    http-request allow if METH_DELETE { path_reg ^(/v1\.[0-9]+)?/volumes/[0-9a-f]{64}$ }

    http-request deny deny_status 403
    default_backend docker-socket

# Its own name: a backend that shares the frontend's name is refused from HAProxy 3.3 on.
backend docker-socket
    server docker unix@/var/run/docker.sock
